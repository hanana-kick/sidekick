name: Sidekick Pages (manual)

# This workflow updates the existing Pages site only after an explicit manual approval.
# It never enables Pages or changes its audience, domain, or security settings.
on:
  workflow_dispatch:
    inputs:
      approve_public_deployment:
        description: 'I approve publishing Sidekick Studio as a public GitHub Pages website'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sidekick-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.approve_public_deployment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the existing Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - run: npm run check:library
      - run: npm run typecheck
      - run: node --test tests/pages-build.test.mjs
      # Relative asset URLs keep this same artifact usable at both the custom
      # domain and /sidekick/. Do not derive a fixed base from the Pages domain.
      - run: npm run build:all
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the explicitly approved Studio build
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for the live deployment check
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify the deployed project URL in Chromium
        run: xvfb-run -a node --test tests/live-pages.test.mjs
        env:
          SIDEKICK_LIVE_URL: https://hanana-kick.github.io/sidekick/
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - name: Save live Pages screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-live-pages
          path: artifacts/
          if-no-files-found: ignore
