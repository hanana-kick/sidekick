name: Sidekick Pages (manual)

# This workflow updates the existing Pages site only after an explicit manual approval.
# It never enables Pages or changes its audience, domain, or security settings.
on:
  workflow_dispatch:
    inputs:
      approve_public_deployment:
        description: 'I approve publishing Sidekick Studio as a public GitHub Pages website'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sidekick-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.approve_public_deployment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the existing Pages configuration
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      - run: npm run check:library
      - run: npm run typecheck
      - run: node --test tests/pages-build.test.mjs
      # Relative asset URLs keep this same artifact usable at both the custom
      # domain and /sidekick/. Do not derive a fixed base from the Pages domain.
      - run: npm run build:all
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.SIDEKICK_GA_MEASUREMENT_ID || 'G-1VRBQNQE89' }}
          # GA4 activation checklist verified for the approved Sidekick property.
          VITE_GA_ENABLED: ${{ vars.SIDEKICK_GA_ENABLED || 'true' }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the explicitly approved Studio build
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for the live deployment check
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify the deployed custom domain and project redirect in Chromium
        run: xvfb-run -a node --test tests/live-pages.test.mjs
        env:
          SIDEKICK_LIVE_URL: https://sidekick.hananakick.cc/
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - name: Walk through the published Guide on desktop and mobile
        run: xvfb-run -a node --test --test-name-pattern='visible complete catalog walkthrough|guide progresses|legacy use-case URL|Guide translates' tests/use-cases-browser.test.mjs
        env:
          SIDEKICK_USECASES_LIVE_URL: https://sidekick.hananakick.cc
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - name: Verify contextual Guide navigation on the published site
        run: xvfb-run -a node --test --test-name-pattern='direct reload, source scroll' tests/guide-navigation-browser.test.mjs
        env:
          SIDEKICK_GUIDE_LIVE_URL: https://sidekick.hananakick.cc
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - name: Verify published interactive state reference in both frameworks
        run: xvfb-run -a node --test --test-name-pattern='state pages.*in en|mobile controls' tests/state-reference-browser.test.mjs
        env:
          SIDEKICK_STATE_LIVE_URL: https://sidekick.hananakick.cc
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - name: Save live Pages screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sidekick-live-pages
          path: artifacts/
          if-no-files-found: ignore
