name: Sidekick checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:library
      - run: npm run typecheck
      - run: npm test
      - name: Verify site analytics remains isolated from consumer packages
        run: npm run test:site-analytics:build
  browser:
    name: Chromium (${{ matrix.suite }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [reference, regression, canvas-interactions]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:library
      - run: npm run build:all
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify complete independent browser suite
        run: xvfb-run -a npm run test:browser:${{ matrix.suite }}
        env:
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts/${{ matrix.suite }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-screenshots-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
