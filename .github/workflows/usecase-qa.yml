name: Guide and multilingual interaction walkthrough
on:
  workflow_dispatch:
    inputs:
      navigation_only:
        description: 'Run only contextual Guide navigation checks'
        type: boolean
        default: false
  push:
    branches: [fix/usecase-ux]
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify all live and copied example layouts
        if: ${{ !inputs.navigation_only }}
        run: xvfb-run -a node --test --test-concurrency=1 tests/framework-example-layout-browser.test.mjs
        env:
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: example-layout-artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && !inputs.navigation_only }}
        with:
          name: example-layout-visuals
          path: example-layout-artifacts/
          if-no-files-found: ignore
      - if: ${{ !inputs.navigation_only }}
        run: xvfb-run -a node --test --test-concurrency=1 tests/site-i18n-browser.test.mjs tests/use-cases-browser.test.mjs tests/api-playground-browser.test.mjs tests/behavior-browser.test.mjs
        env:
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - if: ${{ inputs.navigation_only }}
        run: xvfb-run -a node --test --test-concurrency=1 tests/guide-navigation-browser.test.mjs
        env:
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: interaction-walkthrough
          path: artifacts/
          if-no-files-found: ignore
