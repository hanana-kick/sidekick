name: Isolated CPU experiment - NOT release validation
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Pilot first; full only after counter and parity validation
        type: choice
        options: [pilot, full, screening, ownership, capability]
        default: pilot
      graphics:
        description: Full matrix subset; pilot always uses Canvas
        type: choice
        options: [all, canvas, swiftshader]
        default: all
      backend:
        description: Full matrix subset; pilot always uses main
        type: choice
        options: [all, main, worker]
        default: all
permissions:
  contents: read
jobs:
  owned-cpu-experiment:
    name: CPU experiment (${{ matrix.backend }}/${{ matrix.graphics }}/${{ matrix.order }}) - NOT release CI
    if: github.ref != 'refs/heads/main' && inputs.plan != 'capability'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.plan == 'ownership' && 8 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.plan == 'screening' && '["main","worker"]' || inputs.plan == 'full' && inputs.backend == 'all' && '["main","worker"]' || inputs.plan == 'full' && inputs.backend == 'worker' && '["worker"]' || '["main"]') }}
        graphics: ${{ fromJSON(inputs.plan == 'full' && inputs.graphics == 'all' && '["canvas","swiftshader"]' || inputs.plan == 'full' && inputs.graphics == 'swiftshader' && '["swiftshader"]' || '["canvas"]') }}
        order: ${{ fromJSON(inputs.plan == 'screening' && '["forward","reverse"]' || '["single"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node --test scripts/ci-cpu/*.test.mjs
      - run: node scripts/ci-cpu/prepare.mjs
      - name: Measure owned sandboxed browser process tree
        run: |
          if [ "$BENCH_PLAN" = ownership ]; then node scripts/ci-cpu/ownership-diagnostic.mjs; elif [ "$BENCH_PLAN" = screening ]; then node scripts/ci-cpu/screen.mjs; else node scripts/ci-cpu/run.mjs; fi
        env:
          BENCH_ORDER: ${{ matrix.order }}
          BENCH_PLAN: ${{ inputs.plan }}
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_GRAPHICS: ${{ matrix.graphics }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpu-experiment-${{ matrix.backend }}-${{ matrix.graphics }}-${{ matrix.order }}
          path: |
            artifacts/ci-cpu/**/result.json
            artifacts/ci-cpu/**/windows.csv
            scripts/ci-cpu/manifest.json
          if-no-files-found: warn

  cgroup-capability:
    name: Read-only owned cgroup capability - NOT performance or release CI
    if: github.ref != 'refs/heads/main' && inputs.plan == 'capability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test path resolution without accessing cgroups
        run: python3 -m unittest discover -s scripts/ci-cpu -p 'test_cgroup_capability.py'
      - name: Read only this process's cgroup capability facts
        run: python3 scripts/ci-cpu/cgroup-capability.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cgroup-capability-only
          path: artifacts/ci-cpu/cgroup-capability/result.json
          if-no-files-found: warn
