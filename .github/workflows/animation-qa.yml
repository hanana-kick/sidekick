name: Isolated CPU experiment - NOT release validation
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Pilot first; full only after counter and parity validation
        type: choice
        options: [pilot, full]
        default: pilot
      graphics:
        description: Full matrix subset; pilot always uses Canvas
        type: choice
        options: [all, canvas, swiftshader]
        default: all
permissions:
  contents: read
jobs:
  owned-cpu-experiment:
    name: CPU experiment (${{ matrix.backend }}/${{ matrix.graphics }}) - NOT release CI
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan == 'full' && (inputs.graphics == 'canvas' && '{"include":[{"backend":"main","graphics":"canvas"},{"backend":"worker","graphics":"canvas"}]}' || inputs.graphics == 'swiftshader' && '{"include":[{"backend":"main","graphics":"swiftshader"},{"backend":"worker","graphics":"swiftshader"}]}' || '{"include":[{"backend":"main","graphics":"canvas"},{"backend":"worker","graphics":"canvas"},{"backend":"main","graphics":"swiftshader"},{"backend":"worker","graphics":"swiftshader"}]}') || '{"include":[{"backend":"main","graphics":"canvas"}]}') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node --test scripts/ci-cpu/*.test.mjs
      - run: node scripts/ci-cpu/prepare.mjs
      - name: Measure owned sandboxed browser process tree
        run: node scripts/ci-cpu/run.mjs
        env:
          BENCH_PLAN: ${{ inputs.plan }}
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_GRAPHICS: ${{ matrix.graphics }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpu-experiment-${{ matrix.backend }}-${{ matrix.graphics }}
          path: |
            artifacts/ci-cpu/result.json
            artifacts/ci-cpu/windows.csv
            scripts/ci-cpu/manifest.json
          if-no-files-found: warn
