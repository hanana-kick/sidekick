name: Full-canvas CPU experiment - NOT release validation
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Pilot validates harness only; full is a separate fixed experiment
        type: choice
        options: [pilot, full, perf-capability]
        default: pilot
permissions:
  contents: read
jobs:
  full-canvas-cpu:
    name: Canvas CPU (${{ matrix.backend }}/${{ matrix.size }}) - NOT release CI
    if: github.ref != 'refs/heads/main' && inputs.plan != 'perf-capability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [main, worker]
        size: ${{ fromJSON(inputs.plan == 'full' && '[115,640]' || '[640]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node --test scripts/ci-cpu/*.test.mjs
      - run: node scripts/ci-cpu/prepare.mjs
      - name: Fixed cycles, no replacements
        run: node scripts/ci-cpu/coordinate.mjs
        env:
          BENCH_PLAN: ${{ inputs.plan }}
          BENCH_BACKEND: ${{ matrix.backend }}
          BENCH_SIZE: ${{ matrix.size }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full-canvas-cpu-${{ matrix.backend }}-${{ matrix.size }}
          path: |
            artifacts/ci-cpu/**/result.json
            artifacts/ci-cpu/**/windows.csv
            artifacts/ci-cpu/adapter-provenance.json
            scripts/ci-cpu/manifest.json
          if-no-files-found: warn

  perf-capability:
    name: Owned task-clock toy capability - NOT browser or release proof
    if: github.ref != 'refs/heads/main' && inputs.plan == 'perf-capability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Existing compiler only, one toy invocation, no fallback
        run: python3 scripts/diagnostics/run-perf-capability.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: owned-task-clock-capability
          path: |
            artifacts/perf-capability/*.json
            artifacts/perf-capability/*.jsonl
            artifacts/perf-capability/*.txt
            scripts/diagnostics/perf-task-clock-toy.c
          if-no-files-found: error
