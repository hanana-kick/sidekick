name: Demo placement regression probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check semantic placement, nested navigation and normal-motion transition
        shell: bash
        run: |
          mkdir -p artifacts
          xvfb-run -a node --test --test-concurrency=1 --test-name-pattern='^(three demos contain|narrow empty community|normal-motion company stories)' tests/api-demo-browser.test.mjs 2>&1 | tee artifacts/demo-placement-probe.log
        env:
          SIDEKICK_HEADED: '1'
          SIDEKICK_SCREENSHOTS: artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: demo-placement-probe
          path: artifacts/
          if-no-files-found: ignore
