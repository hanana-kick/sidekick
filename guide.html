<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidekick · Guide</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./playground/shared-header.css"><link rel="stylesheet" href="./playground/use-cases.css"></head>
<body><header class="app-header"><div id="site-header-brand" class="site-header-brand"></div></header>

<main id="scenario-main"><header class="scenario-heading"><p id="breadcrumb" class="eyebrow"></p><h1 id="scenario-title"></h1><p id="scenario-sentence"></p><p id="scenario-hint" class="muted"></p></header>
<section id="lesson-content" hidden=""></section>
<section id="progressive-guide"><nav class="learning-steps" aria-label="설정 단계" data-guide-label="커스텀 깊이"><button data-level="1" aria-pressed="true"><span data-guide-i18n="1. 간단하게 사용">1. 기본 선언</span></button><button data-level="2" aria-pressed="false"><span data-guide-i18n="2. 옵션 조절">2. 옵션 설정</span></button><button data-level="3" aria-pressed="false"><span data-guide-i18n="3. 앱 이벤트 연결">3. 앱 이벤트 연결</span></button><button data-level="4" aria-pressed="false"><span data-guide-i18n="4. 직접 동작 조합">4. 직접 동작 조합</span></button></nav><p id="level-explanation"></p><div id="level-options" hidden=""><label><span data-guide-i18n="봇 위치">봇 위치</span><select id="behavior-side"><option value="left" data-guide-i18n="왼쪽">왼쪽</option><option value="right" data-guide-i18n="오른쪽">오른쪽</option><option value="above" data-guide-i18n="위">위</option><option value="below" data-guide-i18n="아래">아래</option></select></label><label><span data-guide-i18n="간격(px)">간격(px)</span><input id="behavior-gap" type="number" min="0" max="48" value="6"></label><label id="dwell-field"><span data-guide-i18n="항목별 검토 시간(ms)">항목별 검토 시간(ms)</span><input id="behavior-dwell" type="number" min="200" max="5000" step="100" value="1400"></label><button id="apply-options"><span data-guide-i18n="옵션 적용">옵션 적용</span></button></div><div id="emotion-options" hidden><label><span data-guide-i18n="감정 강도">감정 강도</span><input id="guide-emotion-intensity" type="number" min="0" max="1" step="0.1" value="0.7"></label><label><span data-guide-i18n="반응 시간(ms)">반응 시간(ms)</span><input id="guide-emotion-duration" type="number" min="0" max="60000" step="100" value="1200"></label></div><div id="manual-controls" hidden=""><button id="run-manual"><span data-guide-i18n="이동 → 시선 → 표정 실행">이동 → 시선 → 표정 실행</span></button><button id="return-declaration"><span data-guide-i18n="선언 방식으로 돌아가기">선언 방식으로 돌아가기</span></button></div></section>
<div class="scenario-workspace"><section class="application" aria-label="실행 중인 앱 예제" data-guide-label="실행 중인 앱 예제"><div class="application-bar"><span data-guide-i18n="LIVE EXAMPLE">실행 예제</span><output id="run-status" role="status" aria-live="polite"><span data-guide-i18n="준비 중">준비 중</span></output></div><div id="demo-app"></div><div class="run-controls"><button id="restart-demo"><span data-guide-i18n="다시 실행">다시 실행</span></button><button id="stop-demo"><span data-guide-i18n="중단">중단</span></button></div></section>
<section class="declaration-panel" aria-label="실행 코드" data-guide-label="실행 코드"><div class="code-heading"><h2><span data-guide-i18n="이 행동을 선언하는 코드">행동 선언 코드</span></h2><button id="copy-code"><span data-guide-i18n="복사">복사</span></button></div><p class="muted"><span data-guide-i18n="아래 선언과 같은 객체를 실제 봇에 전달합니다.">아래 선언과 같은 객체를 실제 봇에 전달합니다.</span></p><pre id="declaration-code" tabindex="0"></pre><details><summary><span data-guide-i18n="앱 이벤트와 연결하기">앱 이벤트와 연결하기</span></summary><pre id="event-code" tabindex="0"></pre></details><p id="copy-status" role="status"></p></section></div>
