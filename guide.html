<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidekick · Guide</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./playground/shared-header.css"><link rel="stylesheet" href="./playground/use-cases.css"></head>
<body><header class="app-header"><div id="site-header-brand" class="site-header-brand"></div></header>
<div class="catalog-layout">
<aside class="catalog-nav"><button id="toc-toggle" aria-expanded="false" aria-controls="scenario-toc">가이드 목차 <span>기초부터 응용까지 ▾</span></button><nav id="scenario-toc" aria-label="가이드 목차"></nav></aside>
<main id="scenario-main"><header class="scenario-heading"><p id="breadcrumb" class="eyebrow"></p><h1 id="scenario-title"></h1><p id="scenario-sentence"></p><p id="scenario-hint" class="muted"></p></header>
<section id="lesson-content" hidden></section>
<section id="progressive-guide"><nav class="learning-steps" aria-label="커스텀 깊이"><button data-level="1" aria-pressed="true">1. 간단하게 사용</button><button data-level="2" aria-pressed="false">2. 옵션 조절</button><button data-level="3" aria-pressed="false">3. 앱 이벤트 연결</button><button data-level="4" aria-pressed="false">4. 직접 동작 조합</button></nav><p id="level-explanation"></p><div id="level-options" hidden><label>봇 위치<select id="behavior-side"><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="above">위</option><option value="below">아래</option></select></label><label>간격(px)<input id="behavior-gap" type="number" min="0" max="48" value="6"></label><label id="dwell-field">항목별 검토 시간(ms)<input id="behavior-dwell" type="number" min="200" max="5000" step="100" value="1400"></label><button id="apply-options">옵션 적용</button></div><div id="manual-controls" hidden><button id="run-manual">이동 → 시선 → 표정 실행</button><button id="return-declaration">선언 방식으로 돌아가기</button></div></section>
<div class="scenario-workspace"><section class="application" aria-label="실행 중인 앱 예제"><div class="application-bar"><span>LIVE EXAMPLE</span><output id="run-status" role="status" aria-live="polite">준비 중</output></div><div id="demo-app"></div><div class="run-controls"><button id="restart-demo">다시 실행</button><button id="stop-demo">중단</button></div></section>
<section class="declaration-panel" aria-label="실행 코드"><div class="code-heading"><h2>이 행동을 선언하는 코드</h2><button id="copy-code">복사</button></div><p class="muted">아래 선언과 같은 객체를 실제 봇에 전달합니다.</p><pre id="declaration-code" tabindex="0"></pre><details><summary>앱 이벤트와 연결하기</summary><pre id="event-code" tabindex="0"></pre></details><p id="copy-status" role="status"></p></section></div>
<footer><p id="session-status" class="muted"></p><p>자연어 문장은 행동의 설명입니다. 실행은 타입이 정해진 선언 객체로 처리합니다.</p><a href="./api-playground.html">세부 API를 직접 조작하려면 API playground →</a></footer></main></div>
<script type="module" src="./playground/use-cases.js"></script></body></html>
