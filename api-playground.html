<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidekick · Movement API playground</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:150vh;background:#f8fafc;color:#0f172a;font:15px/1.6 system-ui,sans-serif}main{max-width:680px;margin:24px;padding:24px;background:white;border:1px solid #cbd5e1;border-radius:16px}h1{font-size:24px;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{padding:9px 14px;border:1px solid #94a3b8;border-radius:8px;background:white;color:#0f172a;cursor:pointer}button:hover{background:#fef08a}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f1f5f9;padding:12px}sidekick-avatar{width:180px;height:180px;z-index:10}a{color:#475569}
</style></head><body>
<main><a href="./">← Studio</a><h1>이동 · 애니메이션 · 에셋 API</h1><p>작은 180 × 180 캔버스를 유지하면서 엘리먼트만 이동합니다. 기본적으로 캐릭터를 통과해 아래 페이지를 클릭할 수 있습니다. 여백을 클릭하면 그 위치로 이동합니다.</p>
<div class="controls"><button id="move">오른쪽으로 이동</button><button id="cancel">이동 취소</button><button id="play">축하 1초</button><button id="stop">활동 중지</button><button id="transition">도형·표정·장식 전환</button><button id="cancel-transition">전환 취소</button></div>
<label><input id="interactive" type="checkbox"> 캐릭터 박스에서 드래그/줌 허용</label>
<label><input id="reduce" type="checkbox"> 일시 정지 (이동·에셋 전환 즉시 적용)</label>
<p>운영체제의 모션 줄이기 설정을 존중합니다. play의 1초는 재생 구간이며 마지막에 idle로 돌아갑니다. 스크롤해도 viewport 위치는 유지됩니다.</p><pre id="status" role="status">초기화 중…</pre>
</main><sidekick-avatar id="bot" placement="viewport" position-x="80" position-y="420" body-color="#FFCC37" shape="ghostish" head-accessory="beret" eyes-accessory="glasses" tracking-mode="eyes"></sidekick-avatar>
<script type="module" src="./playground/api-playground.js"></script></body></html>
