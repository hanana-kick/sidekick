<!doctype html><meta charset="utf-8"><title>Live target following check</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f6fa;color:#18202c}button,a{padding:10px;margin:4px}#pane{position:relative;width:min(600px,90vw);height:420px;overflow:auto;background:white;border:2px solid #8595b2}#content{position:relative;height:1600px;background:repeating-linear-gradient(#fff 0 99px,#edf0f7 100px)}#target{position:absolute;left:220px;top:240px;width:115px;height:115px;background:#d4e6ff;border:2px dashed #4572bd;box-sizing:border-box}pre{white-space:pre-wrap;max-width:900px}sidekick-avatar{pointer-events:none;z-index:5}</style>
<h1>Live target following</h1><p>Normal motion. The blue square is inside a nested scrolling container. Scroll manually while the bot follows, or run the repeatable reversal check. Result is authored movement telemetry, not a CPU/FPS benchmark.</p>
<button id="run">Run scroll/reversal check</button><button id="stop">Cancel</button><a href="../dist/api-playground.html?lang=en">Actual demos</a><pre id="status">Loading…</pre><div id="pane"><div id="content"><div id="target">Live target</div></div></div>
<sidekick-avatar id="bot" placement="viewport" size="115" interaction="none"></sidekick-avatar>
<script type="module">
import '../dist/browser/sidekick.js';
const bot=document.querySelector('#bot'),target=document.querySelector('#target'),pane=document.querySelector('#pane'),status=document.querySelector('#status'),button=document.querySelector('#run');
if(!bot.ready)await new Promise(resolve=>bot.addEventListener('sidekick-ready',resolve,{once:true}));bot.movementBounds='none';let revision=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
status.textContent='Ready. '+JSON.stringify(bot.diagnostics.graphics)+'; reduced motion='+matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelector('#stop').onclick=()=>{revision++;bot.cancelMove();bot.detachAnchor();button.disabled=false;status.textContent='Cancelled';};
button.onclick=async()=>{const token=++revision;button.disabled=true;bot.cancelMove();bot.detachAnchor();pane.scrollTop=0;target.style.left='220px';target.style.top='240px';await bot.moveTo({x:20,y:150},{duration:0,travel:'none'});let completions=0;const samples=[];const record=()=>samples.push({t:performance.now(),...bot.movementState});const done=()=>completions++;bot.addEventListener('sidekick-move-progress',record);bot.addEventListener('sidekick-move-end',done);const start=performance.now();const moving=bot.moveToElement(target,{anchor:true,duration:550,travel:'none'});status.textContent='Following: scrolling and reversing target…';for(const [delay,scroll,left,top] of [[140,120,220,240],[140,30,220,240],[140,30,320,280]]){await wait(delay);if(token!==revision)break;pane.scrollTop=scroll;target.style.left=left+'px';target.style.top=top+'px';}const result=await moving;bot.removeEventListener('sidekick-move-progress',record);bot.removeEventListener('sidekick-move-end',done);if(token!==revision)return;const b=bot.getBoundingClientRect(),r=target.getBoundingClientRect();const report={finished:result.finished,elapsedMs:Math.round(performance.now()-start),completions,errorPx:Math.hypot(b.left-r.left,b.top-r.top),samples:samples.length,graphics:bot.diagnostics.graphics,viewport:[innerWidth,innerHeight]};window.lastFollowingReport={...report,samples};status.textContent=JSON.stringify(report,null,2)+'\nKeep scrolling manually to check continued following. No repeated completion event is expected.';button.disabled=false;};
</script>
